name: Build Common Crawl WET index

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of WET files to process"
        required: false
        default: "2"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m search_engine.download_wet --limit ${{ inputs.limit }}
      - run: python -m search_engine.index_wet
      - uses: actions/upload-artifact@v4
        with:
          name: search-index
          path: search.db
          retention-days: 7
